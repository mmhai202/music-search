<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Search</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <h1>Music Search</h1>
          </div>
          <button class="panel-reset is-hidden" id="previewReset" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M7.1 5.4h9.8c1 0 1.7.8 1.7 1.7v9.8c0 1-.8 1.7-1.7 1.7H7.1c-1 0-1.7-.8-1.7-1.7V7.1c0-1 .8-1.7 1.7-1.7Zm.3 2v9.2h9.2V7.4H7.4Z"/>
            </svg>
            <span>Đặt lại</span>
          </button>
        </div>

        <section class="action-group">
          <div class="action-title">
            <h2>Tìm kiếm qua audio đang phát</h2>
          </div>
          <label class="device-picker" for="deviceSelect">
            <span class="device-label">Chọn nguồn audio</span>
            <span class="device-selected" id="selectedDeviceText">Auto</span>
            <select id="deviceSelect">
              <option value="">Auto</option>
            </select>
          </label>
          <button class="listen-button" id="listenButton" type="button">
            <span class="disc"></span>
            <span id="buttonText">Tìm bài đang phát</span>
          </button>
        </section>

        <section class="action-group">
          <div class="action-title">
            <h2>Tìm kiếm qua microphone</h2>
          </div>
          <label class="device-picker" for="microphoneSelect">
            <span class="device-label">Chọn microphone</span>
            <span class="device-selected" id="selectedMicrophoneText">Auto</span>
            <select id="microphoneSelect">
              <option value="">Auto</option>
            </select>
          </label>
          <button class="listen-button mic-button" id="microphoneButton" type="button">
            <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3c-1.9 0-3.4 1.5-3.4 3.4v5.2c0 1.9 1.5 3.4 3.4 3.4s3.4-1.5 3.4-3.4V6.4C15.4 4.5 13.9 3 12 3Z"/>
              <path d="M5.9 10.4c0-.5.4-.9.9-.9s.9.4.9.9v1.2c0 2.4 1.9 4.3 4.3 4.3s4.3-1.9 4.3-4.3v-1.2c0-.5.4-.9.9-.9s.9.4.9.9v1.2c0 3-2.2 5.6-5.2 6v1.6h2.6c.5 0 .9.4.9.9s-.4.9-.9.9H8.5c-.5 0-.9-.4-.9-.9s.4-.9.9-.9h2.6v-1.6c-2.9-.4-5.2-3-5.2-6v-1.2Z"/>
            </svg>
            <span id="microphoneButtonText">Ghi âm và tìm bài</span>
          </button>
        </section>

        <section class="action-group">
          <div class="action-title">
            <h2>Tìm kiếm qua file audio</h2>
          </div>
          <div class="upload-box">
            <input class="visually-hidden" id="audioFile" type="file">
            <label class="file-picker" for="audioFile">
              <span class="file-icon" aria-hidden="true">
                <svg class="folder-icon" viewBox="0 0 24 24" focusable="false">
                  <path class="folder-tab" d="M3.7 7.2c0-1 .8-1.8 1.8-1.8h4.2c.5 0 1 .2 1.3.6l1.3 1.5h6.2c1 0 1.8.8 1.8 1.8v1.5H3.7V7.2Z"/>
                  <path class="folder-body" d="M3.7 9.4h16.6v7.7c0 1.1-.9 2-2 2H5.7c-1.1 0-2-.9-2-2V9.4Z"/>
                  <path class="folder-shine" d="M7.1 12.1h8.4"/>
                </svg>
              </span>
              <span class="file-text">
                <span class="file-kicker">File audio</span>
                <span class="file-name" id="fileName">Chọn file để tìm</span>
                <span class="file-hint">MP3, WAV, M4A, MP4, FLAC, OGG, WEBM</span>
              </span>
            </label>
            <button class="upload-button" id="uploadButton" type="button">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m20.4 18.9-4.2-4.2a7.2 7.2 0 1 0-1.5 1.5l4.2 4.2a1.1 1.1 0 0 0 1.5-1.5ZM5.1 10.7a5.6 5.6 0 1 1 5.6 5.6 5.6 5.6 0 0 1-5.6-5.6Z"/>
              </svg>
              <span id="uploadButtonText">Tìm kiếm</span>
            </button>
          </div>
        </section>

        <div class="file-preview is-hidden" id="filePreview">
          <audio id="previewAudio" preload="metadata"></audio>
          <div class="preview-head">
            <button class="preview-play" id="previewPlay" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path id="previewPlayIcon" d="M8 5.8c0-.8.9-1.3 1.6-.9l8.2 5.2c.7.4.7 1.4 0 1.8l-8.2 5.2c-.7.4-1.6-.1-1.6-.9V5.8Z"/>
              </svg>
              <span id="previewPlayText">Nghe thử</span>
            </button>
            <span class="preview-range-text" id="previewRangeText">00:00 - 00:10</span>
          </div>
          <div class="waveform-box" id="waveformBox">
            <canvas class="waveform-canvas" id="waveformCanvas"></canvas>
          </div>
        </div>

        <div class="result" id="result">
          <p class="muted">Bấm nút để nghe audio hệ thống, hoặc chọn file audio để nhận diện.</p>
        </div>
      </section>

      <section class="history-wrap">
        <div class="history-head">
          <h2>Lịch sử</h2>
          <button class="ghost-button" id="clearButton" type="button">Xóa tất cả</button>
        </div>
        <div class="history" id="history"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
